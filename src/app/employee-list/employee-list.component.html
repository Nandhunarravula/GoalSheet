  <div class="container">
    <h2>Employees</h2>
    <div class="row">
      <div class="col-md-6 col-lg-4 mb-4" *ngFor="let employee of employees">
        <div class="card employee-card" (click)="showDetails(employee.name)">
          <div class="card-body">
            <h5 class="card-title">{{ employee.name }}</h5>
            <div class="employee-details">
              <p class="card-text mb-1">
                <strong>Emp ID:</strong> {{ employee.empId }}
              </p>
              <p class="card-text mb-1">
                <strong>Role:</strong> {{ employee.role }}
              </p>
              <p class="card-text mb-0">
                <strong>Mobile:</strong> {{ employee.mobile }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <button class="add-btn" (click)="addEmployee()">+</button>
  </div>
